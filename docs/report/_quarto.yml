project:
  type: book
  output-dir: _output

book:
  title: "OpenPFC Applications"
  subtitle: "Models, spectral formulations, and scalability"
  author: "VTT Technical Research Centre of Finland Ltd"
  date: today
  chapters:
    - index.qmd
    - 00_abstract.qmd
    - 01_introduction.qmd
    - 02_numerical_methods.qmd
    - part: "Phase-field crystal"
      chapters:
        - 03_tungsten.qmd
        - 04_aluminum.qmd
    - part: "High-order spectral models"
      chapters:
        - 05_cahn_hilliard.qmd
        - 06_thin_film.qmd
        - 07_surface_diffusion.qmd
        - 08_kawahara.qmd
        - 09_ehd_film.qmd
        - 10_higher_order_pfc.qmd
        - 11_gradient_elasticity.qmd
    - part: "Finite-difference models"
      chapters:
        - 12_heat3d.qmd
        - 13_wave2d.qmd
        - 14_allen_cahn.qmd
        - 15_kobayashi.qmd
    - part: "Coupled multiphysics"
      chapters:
        - 16_alloy_dendrite.qmd
        - 17_vlasov_maxwell.qmd
    - part: "PDE-constrained inverse design"
      chapters:
        - 21_inverse_homogenization.qmd
    - 18_scalability.qmd
    - 19_conclusions.qmd
    - 20_references.qmd

format:
  html:
    theme: cosmo
    toc: true
    number-sections: true
    html-math-method: mathjax
  pdf:
    documentclass: scrreprt
    number-sections: true
    geometry:
      - margin=25mm

bibliography: references.bib
# Author-date, pandoc's default. Not a downloaded CSL: the report has to
# render on LUMI, where a login node has no route to zotero.org, and a
# citation style that only resolves with a network connection is a build that
# breaks the first time someone tries to reproduce it offline.
link-citations: true

# No compute engine: figures are committed SVGs regenerated by
# figures/make_figures.py, so the report renders with quarto alone.
engine: markdown
