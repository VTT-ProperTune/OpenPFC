metadata-files:
  - _metadata.yml

project:
  type: website
  output-dir: _build/site
  pre-render:
    - python3 ../scripts/package_example_lessons.py
  resources:
    - "*/*/lesson.zip"
  render:
    - index.qmd
    - start/index.qmd
    - coverage.qmd
    - "*/*/index.qmd"
website:
  title: OpenPFC by example
  navbar:
    left:
      - text: Lessons
        href: index.qmd
      - text: Handbook
        href: https://vtt-propertune.github.io/OpenPFC/docs/
format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
execute:
  enabled: false
