name: Documentation

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
    paths:
      - 'docs/**'
      - 'include/**/*.hpp'
      - 'examples/**/*.cpp'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'INSTALL.md'
      - 'scripts/check_doc_links.py'
      - 'scripts/check_doc_bash_syntax.py'
      - 'scripts/check_doc_toolchain_refs.py'
      - 'scripts/check_doxygen_log.py'
      - 'scripts/check_sphinx_log.py'
      - 'scripts/check_examples_catalog.py'
      - 'scripts/check_end_to_end_allen_cahn.py'
      - 'scripts/build_docs.sh'
      - 'scripts/build_handbook.sh'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: "documentation-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check-documentation-source:
    name: Check documentation source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          show-progress: false

      - name: Run documentation source checks
        id: source-checks
        shell: bash
        run: |
          set +e
          status=0
          : > documentation-source-checks.log

          run_check() {
            local label="$1"
            shift
            echo "=== ${label} ===" | tee -a documentation-source-checks.log
            "$@" 2>&1 | tee -a documentation-source-checks.log
            local code=${PIPESTATUS[0]}
            echo | tee -a documentation-source-checks.log
            if [[ ${code} -ne 0 ]]; then
              status=1
            fi
          }

          run_check "Relative Markdown links" \
            python3 scripts/check_doc_links.py
          run_check "Documentation toolchain references" \
            python3 scripts/check_doc_toolchain_refs.py
          run_check "Examples catalog" \
            python3 scripts/check_examples_catalog.py
          run_check "Allen-Cahn tutorial consistency" \
            python3 scripts/check_end_to_end_allen_cahn.py
          run_check "Fenced shell syntax" \
            python3 scripts/check_doc_bash_syntax.py

          exit ${status}

      - name: Upload source-check diagnostics
        if: failure() && steps.source-checks.conclusion == 'failure'
        uses: actions/upload-artifact@v5
        with:
          name: documentation-source-checks-log
          path: documentation-source-checks.log
          retention-days: 7

  build-documentation:
    name: Build unified documentation
    needs: check-documentation-source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Doxygen and Ninja
        run: |
          bash scripts/ci/apt_update.sh
          sudo apt-get install -y doxygen ninja-build

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: |
            docs/pyproject.toml
            docs/uv.lock

      - name: Resolve locked documentation environment
        run: uv sync --project docs --locked

      - name: Build Sphinx site with integrated API
        id: documentation-build
        env:
          OPENPFC_REPOSITORY: ${{ github.repository }}
          OPENPFC_REVISION: ${{ github.sha }}
        run: |
          set -o pipefail
          bash scripts/build_docs.sh build 2>&1 | tee documentation-build.log

      - name: Check Doxygen diagnostics
        if: success()
        run: python3 scripts/check_doxygen_log.py build/docs/doxygen.log

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: documentation-build-log
          path: |
            documentation-build.log
            build/docs/sphinx.log
            build/docs/doxygen.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload documentation for the site
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'VTT-ProperTune/OpenPFC'
        uses: actions/upload-artifact@v5
        with:
          name: documentation-html
          path: site
          retention-days: 1

  # The website is ahojukka5/openpfc-pages (private, Quarto). VTT-ProperTune
  # receives master as a mirror of ahojukka5/OpenPFC and is the only place it
  # is published; the fork builds the documentation but does not deploy.
  build-site:
    name: Render the website with the documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'VTT-ProperTune/OpenPFC'
    needs: build-documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: OpenPFC
    env:
      QUARTO_VERSION: 1.10.19
    steps:
      - name: Check out the website source
        uses: actions/checkout@v5
        with:
          repository: ahojukka5/openpfc-pages
          ref: master
          token: ${{ secrets.OPENPFC_PAGES_REPO }}
          path: pages
          persist-credentials: false

      - name: Install pinned Quarto
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/quarto"
          mkdir -p "$prefix"
          curl -fsSL "https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/quarto-${QUARTO_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C "$prefix" --strip-components=1
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Render the website
        working-directory: pages
        run: quarto render

      - name: Download the documentation
        uses: actions/download-artifact@v5
        with:
          name: documentation-html
          path: documentation

      - name: Serve the handbook at docs/ and keep the old API URLs
        run: |
          set -euo pipefail
          rm -rf pages/_site/docs
          mv documentation pages/_site/docs
          for old in dev api; do
            mkdir -p "pages/_site/${old}"
            cat > "pages/_site/${old}/index.html" <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <link rel="canonical" href="../docs/api/">
          <meta http-equiv="refresh" content="0; url=../docs/api/">
          <title>OpenPFC API reference moved</title>
          <p>The API reference moved to <a href="../docs/api/">docs/api/</a>.</p>
          EOF
          done
          {
            echo "openpfc: ${{ github.sha }}"
            echo "openpfc-pages: $(git -C pages rev-parse HEAD)"
          } > pages/_site/revision.txt

      - name: Check links and resources of the combined site
        run: python3 pages/tools/check_site.py pages/_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages/_site

  deploy-pages:
    name: Deploy the website
    needs: build-site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
