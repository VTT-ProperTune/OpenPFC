name: Documentation

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
    paths:
      - 'docs/**'
      - 'include/**/*.hpp'
      - 'examples/**/*.cpp'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'INSTALL.md'
      - 'scripts/check_doc_links.py'
      - 'scripts/check_doc_bash_syntax.py'
      - 'scripts/check_doc_toolchain_refs.py'
      - 'scripts/check_doxygen_log.py'
      - 'scripts/check_sphinx_log.py'
      - 'scripts/check_examples_catalog.py'
      - 'scripts/check_end_to_end_allen_cahn.py'
      - 'scripts/build_docs.sh'
      - 'scripts/build_handbook.sh'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

concurrency:
  group: "documentation-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check-documentation-source:
    name: Check documentation source
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Run documentation source checks
        id: source-checks
        shell: bash
        run: |
          set +e
          status=0
          : > documentation-source-checks.log

          run_check() {
            local label="$1"
            shift
            echo "=== ${label} ===" | tee -a documentation-source-checks.log
            "$@" 2>&1 | tee -a documentation-source-checks.log
            local code=${PIPESTATUS[0]}
            echo | tee -a documentation-source-checks.log
            if [[ ${code} -ne 0 ]]; then
              status=1
            fi
          }

          run_check "Relative Markdown links" \
            python3 scripts/check_doc_links.py
          run_check "Documentation toolchain references" \
            python3 scripts/check_doc_toolchain_refs.py
          run_check "Examples catalog" \
            python3 scripts/check_examples_catalog.py
          run_check "Allen-Cahn tutorial consistency" \
            python3 scripts/check_end_to_end_allen_cahn.py
          run_check "Fenced shell syntax" \
            python3 scripts/check_doc_bash_syntax.py

          exit ${status}

      - name: Upload source-check diagnostics
        if: failure() && steps.source-checks.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: documentation-source-checks-log
          path: documentation-source-checks.log
          retention-days: 7

  build-documentation:
    name: Build unified documentation
    needs: check-documentation-source
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doxygen and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen ninja-build

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: |
            docs/pyproject.toml
            docs/uv.lock

      - name: Resolve locked documentation environment
        run: uv sync --project docs --locked

      - name: Build Sphinx site with integrated API
        id: documentation-build
        env:
          OPENPFC_REPOSITORY: ${{ github.repository }}
          OPENPFC_REVISION: ${{ github.sha }}
        run: |
          set -o pipefail
          bash scripts/build_docs.sh build 2>&1 | tee documentation-build.log

      - name: Check Doxygen diagnostics
        if: success()
        run: python3 scripts/check_doxygen_log.py build/docs/doxygen.log

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-build-log
          path: |
            documentation-build.log
            build/docs/sphinx.log
            build/docs/doxygen.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload unified documentation artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: site
          retention-days: 7

  deploy-pages:
    name: Deploy documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-documentation
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download unified documentation
        uses: actions/download-artifact@v4
        with:
          name: documentation-html
          path: ./pages

      - name: Preserve legacy Doxygen URL
        run: |
          mkdir -p pages/dev
          cat > pages/dev/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <link rel="canonical" href="../api/">
          <meta http-equiv="refresh" content="0; url=../api/">
          <title>OpenPFC API reference moved</title>
          <p>The API reference moved to <a href="../api/">the unified documentation site</a>.</p>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Comment on commit after deployment
        if: success()
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `Documentation deployed: ${{ steps.deployment.outputs.page_url }}`
            })
