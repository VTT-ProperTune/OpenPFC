name: Coverage

on:
  push:
    branches: [ "master", "main", "develop" ]
  schedule:
    # Run coverage weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  # ============================================================================
  # Code Coverage Analysis
  # ============================================================================
  coverage:
    name: Code Coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-11 \
            g++-11 \
            cmake \
            ninja-build \
            libopenmpi-dev \
            openmpi-bin \
            libfftw3-dev \
            libfftw3-mpi-dev \
            nlohmann-json3-dev \
            bc \
            lcov

      - name: Cache HeFFTe
        id: cache-heffte
        uses: actions/cache@v5
        with:
          path: ~/opt/heffte/2.4.1-cpu
          key: heffte-2.4.1-cpu-ubuntu-24.04-coverage

      - name: Build HeFFTe (if not cached)
        if: steps.cache-heffte.outputs.cache-hit != 'true'
        env:
          CC: gcc-11
          CXX: g++-11
        run: scripts/install-heffte-ci.sh Debug /tmp/heffte-build-coverage

      - name: Configure OpenPFC with Coverage
        env:
          CC: gcc-11
          CXX: g++-11
        run: |
          cmake -S . -B build \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH=$HOME/opt/heffte/2.4.1-cpu \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage" \
            -DCMAKE_C_FLAGS="--coverage -fprofile-arcs -ftest-coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DGCOV_EXECUTABLE=gcov-11 \
            -DOpenPFC_ENABLE_CODE_COVERAGE=ON \
            -DOpenPFC_BUILD_TESTS=ON \
            -DOpenPFC_BUILD_EXAMPLES=OFF \
            -DOpenPFC_BUILD_APPS=OFF \
            -DOpenPFC_BUILD_DOCUMENTATION=OFF \
            -DOpenPFC_RUN_MPI_SUITES=ON \
            -DOpenPFC_MPI_TEST_MAX_WORLD_SIZE=2

      - name: Build OpenPFC
        run: cmake --build build -j2

      - name: Run Tests
        working-directory: build
        run: |
          # Same CTest invocation as ci.yml (add_test targets, e.g. openpfc-all-tests)
          ctest --output-on-failure -j2 \
            --exclude-regex "benchmark" \
            --timeout 300

      - name: Generate coverage report
        working-directory: build
        run: |
          echo "gcno count: $(find . -name '*.gcno' | wc -l)"
          echo "gcda count: $(find . -name '*.gcda' | wc -l)"
          if ! find . -name '*.gcda' | grep -q .; then
            echo "::error::No .gcda files under build/; coverage instrumentation did not run"
            find . -name '*.gcno' | head
            exit 1
          fi
          # Ubuntu 24.04 ships lcov 2.x, which is stricter than 1.x.
          lcov --directory . --capture --output-file coverage.info \
            --gcov-tool gcov-11 \
            --ignore-errors mismatch,gcov,empty,negative,unused
          lcov --remove coverage.info \
            '/usr/*' \
            '*/tests/*' \
            '*/examples/*' \
            '*/extern/*' \
            '*/_deps/*' \
            --ignore-errors unused,empty \
            --output-file coverage.info
          genhtml coverage.info --output-directory coverage-html \
            --ignore-errors source,unmapped || genhtml coverage.info --output-directory coverage-html
          lcov --list coverage.info > coverage-summary.txt

      - name: Display coverage summary
        working-directory: build
        run: |
          echo "=== Coverage Summary ==="
          cat coverage-summary.txt
          
          # Extract overall coverage percentage
          COVERAGE=$(lcov --summary coverage.info 2>&1 | grep "lines" | awk '{print $2}')
          echo "Overall line coverage: $COVERAGE"
          
          # Check if coverage meets threshold (90%)
          COVERAGE_NUM=$(echo $COVERAGE | sed 's/%//')
          if (( $(echo "$COVERAGE_NUM < 90.0" | bc -l) )); then
            echo "⚠️  Warning: Coverage $COVERAGE is below 90% threshold"
          else
            echo "✅ Coverage $COVERAGE meets 90% threshold"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/coverage.info
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: build/coverage-html
          retention-days: 30

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('build/coverage-summary.txt', 'utf8');
            const lines = summary.split('\n');
            const coverageLine = lines.find(line => line.includes('Total:'));
            
            if (coverageLine) {
              const comment = `## 📊 Code Coverage Report\n\n\`\`\`\n${coverageLine}\n\`\`\`\n\n[View detailed report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
