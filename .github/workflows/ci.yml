name: Unit Tests

on:
  push:
    branches: [ "master", "main", "develop" ]
  pull_request:
    branches: [ "master", "main" ]

# Cancel in-progress runs when a new workflow with the same group name starts
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Code Quality Checks
  # ============================================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Check code formatting (clang-format)
        continue-on-error: true
        uses: jidicula/clang-format-action@v4.18.0
        with:
          clang-format-version: '20'
          check-path: '.'
          exclude-regex: '(build|\.cache|extern|third[-_]party|doxygen-awesome-css)'

      - name: Clean up clang-format artifacts
        run: rm -f failing-files.txt

      - name: Check REUSE compliance
        uses: fsfe/reuse-action@v6

      - name: Kernel layering (no frontend includes)
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          bash scripts/check_kernel_no_frontend_includes.sh

      - name: Kernel layering self-test (checker detects a deliberate violation)
        run: bash scripts/check_kernel_no_frontend_includes.sh --self-test

      - name: GPU memcpy stays in runtime/gpu
        run: bash scripts/check_gpu_memcpy_single_source.sh

      - name: GPU memcpy checker self-test
        run: bash scripts/check_gpu_memcpy_single_source.sh --self-test

  # ============================================================================
  # CMake Build Matrix
  # ============================================================================
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    needs: [code-quality]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        compiler: [gcc-13]
        build_type: [Debug, Release]
        include:
          - compiler: gcc-13
            cc: gcc-13
            cxx: g++-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ${{ matrix.cc }} \
            ${{ matrix.cxx }} \
            cmake \
            ninja-build \
            libopenmpi-dev \
            openmpi-bin \
            libfftw3-dev \
            libfftw3-mpi-dev \
            nlohmann-json3-dev

      - name: Cache HeFFTe
        id: cache-heffte
        uses: actions/cache@v5
        with:
          path: ~/opt/heffte/2.4.1-cpu
          key: heffte-2.4.1-cpu-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}

      - name: Build and Install HeFFTe
        if: steps.cache-heffte.outputs.cache-hit != 'true'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: scripts/install-heffte-ci.sh "${{ matrix.build_type }}" /tmp/heffte-build-openpfc-ci

      - name: Configure OpenPFC
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build \
            -GNinja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH=$HOME/opt/heffte/2.4.1-cpu \
            -DOpenPFC_BUILD_TESTS=ON \
            -DOpenPFC_BUILD_EXAMPLES=ON \
            -DOpenPFC_BUILD_APPS=ON \
            -DOpenPFC_BUILD_DOCUMENTATION=OFF \
            -DOpenPFC_RUN_MPI_SUITES=ON \
            -DOpenPFC_MPI_TEST_MAX_WORLD_SIZE=2

      - name: Build OpenPFC
        run: cmake --build build -j2

      - name: Run Tests
        working-directory: build
        run: |
          set -o pipefail
          # Run tests with verbose output on failure
          ctest --output-on-failure -j2 \
            --exclude-regex "benchmark" \
            --timeout 300 | tee ctest.log
          # Record CTest wall-time.
          total=$(grep -E "Total Test time" ctest.log | tail -1 || true)
          echo "${{ matrix.compiler }}/${{ matrix.build_type }} CTest — ${total:-time unavailable}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Compile benchmarks
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build-benchmarks \
            -GNinja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH=$HOME/opt/heffte/2.4.1-cpu \
            -DOpenPFC_BUILD_TESTS=ON \
            -DOpenPFC_BUILD_BENCHMARKS=ON \
            -DOpenPFC_BUILD_EXAMPLES=OFF \
            -DOpenPFC_BUILD_APPS=OFF \
            -DOpenPFC_BUILD_DOCUMENTATION=OFF \
            -DOpenPFC_ENABLE_CODE_COVERAGE=OFF
          cmake --build build-benchmarks --target openpfc-tests -j2

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.build_type }}
          path: build/Testing/Temporary/LastTest.log

  # Second compiler on branch pushes only (not pull requests).
  build-gcc11-debug:
    name: ubuntu-24.04 / gcc-11 / Debug
    if: github.event_name == 'push'
    needs: [code-quality]
    runs-on: ubuntu-24.04
    env:
      CC: gcc-11
      CXX: g++-11
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-11 g++-11 cmake ninja-build \
            libopenmpi-dev openmpi-bin libfftw3-dev libfftw3-mpi-dev \
            nlohmann-json3-dev
      - name: Cache HeFFTe
        id: cache-heffte
        uses: actions/cache@v5
        with:
          path: ~/opt/heffte/2.4.1-cpu
          key: heffte-2.4.1-cpu-ubuntu-24.04-gcc-11-Debug
      - name: Build and Install HeFFTe
        if: steps.cache-heffte.outputs.cache-hit != 'true'
        run: scripts/install-heffte-ci.sh Debug /tmp/heffte-build-openpfc-ci
      - name: Configure OpenPFC
        run: |
          cmake -S . -B build \
            -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH=$HOME/opt/heffte/2.4.1-cpu \
            -DOpenPFC_BUILD_TESTS=ON \
            -DOpenPFC_BUILD_EXAMPLES=ON \
            -DOpenPFC_BUILD_APPS=ON \
            -DOpenPFC_BUILD_DOCUMENTATION=OFF \
            -DOpenPFC_RUN_MPI_SUITES=ON \
            -DOpenPFC_MPI_TEST_MAX_WORLD_SIZE=2
      - name: Build OpenPFC
        run: cmake --build build -j2
      - name: Run Tests
        working-directory: build
        run: |
          ctest --output-on-failure -j2 \
            --exclude-regex "benchmark" \
            --timeout 300
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-ubuntu-24.04-gcc-11-Debug
          path: build/Testing/Temporary/LastTest.log

  # ============================================================================
  # Packaging smoke test (audit 11 / PN): install OpenPFC and build a downstream
  # consumer against it via find_package(OpenPFC). Guards the export set, the
  # OpenPFCConfig transitive dependencies, and the header-only install filter.
  # Validated locally on tohtori; the flow mirrors tests/packaging/consumer.
  # ============================================================================
  packaging-smoke:
    name: Packaging (find_package consumer)
    needs: [code-quality]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 cmake ninja-build \
            libopenmpi-dev openmpi-bin libfftw3-dev libfftw3-mpi-dev nlohmann-json3-dev

      - name: Cache HeFFTe
        id: cache-heffte
        uses: actions/cache@v5
        with:
          path: ~/opt/heffte/2.4.1-cpu
          key: heffte-2.4.1-cpu-ubuntu-24.04-gcc-13-Release

      - name: Build and Install HeFFTe
        if: steps.cache-heffte.outputs.cache-hit != 'true'
        env: { CC: gcc-13, CXX: g++-13 }
        run: scripts/install-heffte-ci.sh Release /tmp/heffte-build-openpfc-ci

      - name: Configure + build + install OpenPFC
        env: { CC: gcc-13, CXX: g++-13 }
        run: |
          cmake -S . -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=$HOME/opt/heffte/2.4.1-cpu \
            -DCMAKE_INSTALL_PREFIX=$HOME/openpfc-prefix \
            -DOpenPFC_BUILD_TESTS=OFF -DOpenPFC_BUILD_APPS=OFF \
            -DOpenPFC_BUILD_EXAMPLES=OFF -DOpenPFC_BUILD_DOCUMENTATION=OFF
          cmake --build build -j2
          cmake --install build

      - name: Fail if device sources leaked into the install
        run: |
          if find "$HOME/openpfc-prefix/include" \( -name '*.cu' -o -name '*.hip' \) | grep .; then
            echo "::error::device sources leaked into installed include tree"; exit 1
          fi

      - name: Build + run downstream consumer via find_package
        env: { CC: gcc-13, CXX: g++-13 }
        run: |
          cmake -S tests/packaging/consumer -B build-consumer -GNinja \
            -DCMAKE_PREFIX_PATH="$HOME/openpfc-prefix;$HOME/opt/heffte/2.4.1-cpu"
          cmake --build build-consumer -j2
          ./build-consumer/consumer

  # ============================================================================
  # Compile-only GPU jobs (audit 11 / PN). GitHub runners have no GPU, but nvcc
  # / hipcc compile without one. Official devel images already ship the toolkit;
  # do not download or compile HeFFTe here (spectral GPU stays cluster-only).
  # OpenPFC_ENABLE_HEFFTE=OFF still builds FD/kernel CUDA and HIP TUs.
  # Push to master/develop only (not PRs). continue-on-error.
  # ============================================================================
  cuda-compile:
    name: CUDA compile-only (no GPU)
    if: github.event_name == 'push'
    needs: [code-quality]
    runs-on: ubuntu-24.04
    continue-on-error: true
    container: nvidia/cuda:12.6.0-devel-ubuntu24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install git and host build deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            git ca-certificates cmake ninja-build gcc-13 g++-13 \
            libopenmpi-dev openmpi-bin nlohmann-json3-dev
      - uses: actions/checkout@v5
        with: { submodules: true }
      - name: Configure + compile FD CUDA (no HeFFTe, no run)
        env: { CC: gcc-13, CXX: g++-13 }
        run: |
          cmake -S . -B build-cuda -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOpenPFC_ENABLE_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=90 \
            -DOpenPFC_ENABLE_HEFFTE=OFF \
            -DOpenPFC_BUILD_TESTS=OFF -DOpenPFC_BUILD_APPS=ON \
            -DOpenPFC_BUILD_EXAMPLES=OFF -DOpenPFC_BUILD_DOCUMENTATION=OFF
          cmake --build build-cuda -j2

  hip-compile:
    name: HIP compile-only (no GPU)
    if: github.event_name == 'push'
    needs: [code-quality]
    runs-on: ubuntu-24.04
    continue-on-error: true
    container: rocm/dev-ubuntu-24.04:6.2-complete
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install git and host build deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            git ca-certificates cmake ninja-build \
            libopenmpi-dev openmpi-bin nlohmann-json3-dev
      - uses: actions/checkout@v5
        with: { submodules: true }
      - name: Configure + compile FD HIP (no HeFFTe, no run)
        run: |
          cmake -S . -B build-hip -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/opt/rocm \
            -DOpenPFC_ENABLE_HIP=ON -DCMAKE_HIP_ARCHITECTURES=gfx90a \
            -DOpenPFC_ENABLE_HEFFTE=OFF \
            -DOpenPFC_BUILD_TESTS=OFF -DOpenPFC_BUILD_APPS=ON \
            -DOpenPFC_BUILD_EXAMPLES=OFF -DOpenPFC_BUILD_DOCUMENTATION=OFF
          cmake --build build-hip -j2

  # ============================================================================
  # Status Check (required for merge)
  # ============================================================================
  ci-status:
    name: CI Status
    if: always()
    needs: [code-quality, build-and-test, packaging-smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.code-quality.result }}" != "success" ]]; then
            echo "❌ Code quality checks failed"
            exit 1
          fi
          if [[ "${{ needs.build-and-test.result }}" != "success" ]]; then
            echo "❌ Build and test failed"
            exit 1
          fi
          if [[ "${{ needs.packaging-smoke.result }}" != "success" ]]; then
            echo "❌ Packaging smoke failed"
            exit 1
          fi
          echo "✅ All CI checks passed"
