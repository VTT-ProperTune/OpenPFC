name: Unit Tests

# Three tiers (see README.md in this directory):
#   pull request  code quality + one build: GCC 13, Release, unit and 2-rank MPI tests
#   push master   adds the small matrix: GCC 13 Debug with the 3/4/6-rank
#                 multigrid transfers and benchmark compile, the Clang compile
#                 check, packaging, CUDA and HIP compile-only
#   monthly       compatibility.yml
# VTT-ProperTune/OpenPFC mirrors master and runs none of these jobs.
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

# A newer pull-request push replaces the running check; master runs finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ============================================================================
  # Code Quality Checks
  # ============================================================================
  code-quality:
    name: Code Quality
    if: github.repository == 'ahojukka5/OpenPFC'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Check code formatting (clang-format)
        continue-on-error: true
        uses: jidicula/clang-format-action@v4.18.0
        with:
          clang-format-version: '20'
          check-path: '.'
          exclude-regex: '(build|\.cache|extern|third[-_]party|doxygen-awesome-css)'

      - name: Clean up clang-format artifacts
        run: rm -f failing-files.txt

      - name: Check REUSE compliance
        uses: fsfe/reuse-action@v6

      - name: Kernel layering (no frontend includes)
        run: |
          bash scripts/ci/apt_update.sh
          sudo apt-get install -y ripgrep
          bash scripts/check_kernel_no_frontend_includes.sh

      - name: Kernel layering self-test (checker detects a deliberate violation)
        run: bash scripts/check_kernel_no_frontend_includes.sh --self-test

      - name: GPU memcpy stays in runtime/gpu
        run: bash scripts/check_gpu_memcpy_single_source.sh

      - name: GPU memcpy checker self-test
        run: bash scripts/check_gpu_memcpy_single_source.sh --self-test

      - name: App self-containment
        run: bash scripts/check_app_self_containment.sh

      - name: App self-containment self-test
        run: bash scripts/check_app_self_containment.sh --self-test

      - name: Accelerator build contract policy
        run: python3 scripts/check_gpu_ci_policy.py

  # ============================================================================
  # The common build, on every event: GCC 13, Release, full unit and MPI tests.
  # ============================================================================
  build-and-test:
    name: ubuntu-24.04 / gcc-13 / Release
    if: github.repository == 'ahojukka5/OpenPFC'
    needs: [code-quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up the build
        id: setup
        uses: ./.github/actions/setup-build
        with:
          os: ubuntu-24.04
          compiler-packages: gcc-13 g++-13
          cc: gcc-13
          cxx: g++-13
          build-type: Release

      - name: Configure OpenPFC
        run: |
          cmake -S . -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=${{ steps.setup.outputs.heffte-prefix }} \
            -DOpenPFC_BUILD_TESTS=ON \
            -DOpenPFC_BUILD_EXAMPLES=ON \
            -DOpenPFC_BUILD_APPS=ON \
            -DOpenPFC_BUILD_DOCUMENTATION=OFF \
            -DOpenPFC_RUN_MPI_SUITES=ON \
            -DOpenPFC_MPI_TEST_MAX_WORLD_SIZE=2

      - name: Build OpenPFC
        run: cmake --build build -j2

      - name: Run tests
        working-directory: build
        run: |
          set -o pipefail
          ctest --output-on-failure -j2 --exclude-regex "benchmark" --timeout 300 | tee ctest.log
          total=$(grep -E "Total Test time" ctest.log | tail -1 || true)
          echo "gcc-13/Release CTest — ${total:-time unavailable}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-gcc-13-Release
          path: build/Testing/Temporary/LastTest.log

  # ============================================================================
  # Master only: Debug, the multi-rank multigrid transfers and benchmarks.
  # ============================================================================
  debug-and-mpi:
    name: ubuntu-24.04 / gcc-13 / Debug + 3/4/6-rank MPI
    if: github.repository == 'ahojukka5/OpenPFC' && github.event_name != 'pull_request'
    needs: [code-quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up the build
        id: setup
        uses: ./.github/actions/setup-build
        with:
          os: ubuntu-24.04
          compiler-packages: gcc-13 g++-13
          cc: gcc-13
          cxx: g++-13
          build-type: Debug

      - name: Configure OpenPFC
        run: |
          cmake -S . -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH=${{ steps.setup.outputs.heffte-prefix }} \
            -DOpenPFC_BUILD_TESTS=ON \
            -DOpenPFC_BUILD_EXAMPLES=ON \
            -DOpenPFC_BUILD_APPS=ON \
            -DOpenPFC_BUILD_DOCUMENTATION=OFF \
            -DOpenPFC_RUN_MPI_SUITES=ON \
            -DOpenPFC_MPI_TEST_MAX_WORLD_SIZE=2

      - name: Build OpenPFC
        run: cmake --build build -j2

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure -j2 --exclude-regex "benchmark" --timeout 300

      # This capability changes the active world from 6 to 3 to 1 ranks.
      # The normal hosted CTest suite is capped at 2 MPI slots; run the
      # targeted independent correctness tests with explicit oversubscription.
      - name: Verify multigrid plan MPI transfers on 3, 4 and 6 ranks
        run: |
          set -euo pipefail
          for ranks in 3 4 6; do
            echo "Checking Q1 planned P/Pt routes on ${ranks} ranks"
            timeout 300s mpiexec --oversubscribe -n "${ranks}" \
              ./build/tests/openpfc-tests "[multigrid_plan_mpi][MPI]"
          done

      - name: Compile benchmarks
        run: |
          cmake -S . -B build-benchmarks -GNinja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH=${{ steps.setup.outputs.heffte-prefix }} \
            -DOpenPFC_BUILD_TESTS=ON \
            -DOpenPFC_BUILD_BENCHMARKS=ON \
            -DOpenPFC_BUILD_EXAMPLES=OFF \
            -DOpenPFC_BUILD_APPS=OFF \
            -DOpenPFC_BUILD_DOCUMENTATION=OFF \
            -DOpenPFC_ENABLE_CODE_COVERAGE=OFF
          cmake --build build-benchmarks --target openpfc-tests -j2

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-gcc-13-Debug
          path: build/Testing/Temporary/LastTest.log

  # ============================================================================
  # Clang compile check (issue #373). Clang enforces rules GCC lets through,
  # such as no requires-clause on a virtual function. Build the library and the
  # test that instantiates the host FFT_Impl with Clang; compile only, because
  # the full Clang build of the suite has separate blockers (#375).
  # ============================================================================
  clang-compile:
    name: Clang compile check (library + FFT backend)
    if: github.repository == 'ahojukka5/OpenPFC' && github.event_name != 'pull_request'
    needs: [code-quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up the build
        id: setup
        uses: ./.github/actions/setup-build
        with:
          os: ubuntu-24.04
          compiler-packages: clang-18 libomp-18-dev gcc-13 g++-13
          cc: gcc-13
          cxx: g++-13
          build-type: Release

      - name: Configure OpenPFC with Clang
        env: { CC: clang-18, CXX: clang++-18 }
        run: |
          cmake -S . -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=${{ steps.setup.outputs.heffte-prefix }} \
            -DOpenPFC_BUILD_TESTS=ON -DOpenPFC_BUILD_APPS=OFF \
            -DOpenPFC_BUILD_EXAMPLES=OFF -DOpenPFC_BUILD_DOCUMENTATION=OFF

      - name: Compile library and FFT backend test with Clang
        run: |
          cmake --build build --target openpfc -j2
          cmake --build build -j2 --target \
            tests/CMakeFiles/openpfc-tests.dir/unit/kernel/fft/test_fft_interface_overriders.cpp.o

  # ============================================================================
  # Packaging smoke test (audit 11 / PN): install OpenPFC and build a downstream
  # consumer against it via find_package(OpenPFC). Guards the export set, the
  # OpenPFCConfig transitive dependencies, and the header-only install filter.
  # ============================================================================
  packaging-smoke:
    name: Packaging (find_package consumer)
    if: github.repository == 'ahojukka5/OpenPFC' && github.event_name != 'pull_request'
    needs: [code-quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up the build
        id: setup
        uses: ./.github/actions/setup-build
        with:
          os: ubuntu-24.04
          compiler-packages: gcc-13 g++-13
          cc: gcc-13
          cxx: g++-13
          build-type: Release

      - name: Configure + build + install OpenPFC
        run: |
          cmake -S . -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=${{ steps.setup.outputs.heffte-prefix }} \
            -DCMAKE_INSTALL_PREFIX=$HOME/openpfc-prefix \
            -DOpenPFC_BUILD_TESTS=OFF -DOpenPFC_BUILD_APPS=OFF \
            -DOpenPFC_BUILD_EXAMPLES=OFF -DOpenPFC_BUILD_DOCUMENTATION=OFF
          cmake --build build -j2
          cmake --install build

      - name: Fail if device sources leaked into the install
        run: |
          if find "$HOME/openpfc-prefix/include" \( -name '*.cu' -o -name '*.hip' \) | grep .; then
            echo "::error::device sources leaked into installed include tree"; exit 1
          fi

      - name: Fail if public .ipp implementation files are missing from the install
        run: |
          ipp="$HOME/openpfc-prefix/include/openpfc/kernel/simulation/simulation_state.ipp"
          if [[ ! -f "$ipp" ]]; then
            echo "::error::$ipp is missing; simulation_state.hpp includes it"; exit 1
          fi

      - name: Build + run downstream consumer via find_package
        run: |
          heffte="${{ steps.setup.outputs.heffte-prefix }}"
          cmake -S tests/packaging/consumer -B build-consumer -GNinja \
            -DCMAKE_PREFIX_PATH="$HOME/openpfc-prefix;${heffte}"
          cmake --build build-consumer -j2
          ./build-consumer/consumer
          cmake -S tests/packaging/startup -B build-startup -GNinja \
            -DCMAKE_PREFIX_PATH="$HOME/openpfc-prefix;${heffte}"
          cmake --build build-startup -j2
          ./build-startup/startup_consumer

  # ============================================================================
  # Compile-only GPU jobs (audit 11 / PN). GitHub runners have no GPU, but nvcc
  # / hipcc compile without one. Official devel images already ship the toolkit;
  # do not download or compile HeFFTe here (spectral GPU stays cluster-only).
  # OpenPFC_ENABLE_HEFFTE=OFF still builds FD/kernel CUDA and HIP TUs.
  # Pushes to master only (the small matrix).
  # After install, reconfigure the same tree with tests enabled and BUILD,
  # but NEVER RUN, the real nodal-multigrid vendor test executable. This
  # verifies Catch2 device-test C++/launch symbols even without allocated GPUs.
  # ============================================================================
  cuda-compile:
    name: CUDA compile-only (no GPU)
    if: github.repository == 'ahojukka5/OpenPFC' && github.event_name != 'pull_request'
    needs: [code-quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: nvidia/cuda:12.6.0-devel-ubuntu24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install git and host build deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            git ca-certificates cmake ninja-build gcc-13 g++-13 catch2 \
            libopenmpi-dev openmpi-bin nlohmann-json3-dev
      - uses: actions/checkout@v5
        with: { submodules: true }
      - name: Configure + compile FD CUDA (no HeFFTe, no run)
        env: { CC: gcc-13, CXX: g++-13 }
        run: |
          cmake -S . -B build-cuda -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DOpenPFC_ENABLE_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=90 \
            -DOpenPFC_ENABLE_HEFFTE=OFF \
            -DOpenPFC_BUILD_TESTS=OFF -DOpenPFC_BUILD_APPS=ON \
            -DOpenPFC_BUILD_EXAMPLES=OFF -DOpenPFC_BUILD_DOCUMENTATION=OFF
          cmake --build build-cuda -j2
          cmake --install build-cuda --prefix "$GITHUB_WORKSPACE/prefix-cuda"
          cmake -S tests/packaging/startup -B startup-cuda -GNinja \
            -DOpenPFC_DIR="$GITHUB_WORKSPACE/prefix-cuda/lib/cmake/OpenPFC"
          cmake --build startup-cuda -j2
          ./startup-cuda/startup_consumer
      - name: Compile and link actual CUDA nodal Q1 tests (never execute)
        env: { CC: gcc-13, CXX: g++-13 }
        run: |
          # Reuse the completed device kernel archive and compiler cache.
          # A missing Catch2 v3, a missing target, or broken CUDA/host
          # launcher declaration must fail this CI job, not silently skip.
          cmake -S . -B build-cuda -DOpenPFC_BUILD_TESTS=ON \
            -DOpenPFC_REQUIRE_GPU_DIRICHLET_TESTS=ON
          cmake --build build-cuda --target test_nodal_multigrid_cuda -j2
          # Verify mandatory hardware tests are registered, without executing
          # any GPU operation on a device-less hosted CI runner.
          ctest --test-dir build-cuda -N -R DirichletGPU_cuda_1rank_Required

  hip-compile:
    name: HIP compile-only (no GPU)
    if: github.repository == 'ahojukka5/OpenPFC' && github.event_name != 'pull_request'
    needs: [code-quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: rocm/dev-ubuntu-24.04:6.2-complete
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install git and host build deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            git ca-certificates cmake ninja-build catch2 \
            libopenmpi-dev openmpi-bin nlohmann-json3-dev
      - uses: actions/checkout@v5
        with: { submodules: true }
      - name: Configure + compile FD HIP (no HeFFTe, no run)
        run: |
          cmake -S . -B build-hip -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/opt/rocm \
            -DOpenPFC_ENABLE_HIP=ON -DCMAKE_HIP_ARCHITECTURES=gfx90a \
            -DOpenPFC_ENABLE_HEFFTE=OFF \
            -DOpenPFC_BUILD_TESTS=OFF -DOpenPFC_BUILD_APPS=ON \
            -DOpenPFC_BUILD_EXAMPLES=OFF -DOpenPFC_BUILD_DOCUMENTATION=OFF
          cmake --build build-hip -j2
          cmake --install build-hip --prefix "$GITHUB_WORKSPACE/prefix-hip"
          cmake -S tests/packaging/startup -B startup-hip -GNinja \
            -DCMAKE_PREFIX_PATH=/opt/rocm \
            -DOpenPFC_DIR="$GITHUB_WORKSPACE/prefix-hip/lib/cmake/OpenPFC"
          cmake --build startup-hip -j2
          ./startup-hip/startup_consumer
      - name: Compile and link actual HIP nodal Q1 tests (never execute)
        run: |
          cmake -S . -B build-hip -DOpenPFC_BUILD_TESTS=ON \
            -DOpenPFC_REQUIRE_GPU_DIRICHLET_TESTS=ON
          cmake --build build-hip --target test_nodal_multigrid_hip -j2
          ctest --test-dir build-hip -N -R DirichletGPU_hip_1rank_Required

  # ============================================================================
  # Status Check. A pull request needs code quality and the common build; a
  # push to master needs every job.
  # ============================================================================
  ci-status:
    name: CI Status
    if: always() && github.repository == 'ahojukka5/OpenPFC'
    needs: [code-quality, build-and-test, debug-and-mpi, clang-compile, packaging-smoke, cuda-compile, hip-compile]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check all jobs status
        env:
          EVENT: ${{ github.event_name }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          pr = os.environ["EVENT"] == "pull_request"
          required = {"code-quality", "build-and-test"}
          failed = []
          for job, info in json.loads(os.environ["RESULTS"]).items():
              result = info["result"]
              if result == "success" or (pr and job not in required and result == "skipped"):
                  continue
              failed.append(f"{job}: {result}")
          if failed:
              print("CI failed:", *failed, sep="\n  ")
              sys.exit(1)
          print("All CI checks passed")
          PY
