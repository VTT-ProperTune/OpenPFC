name: Compatibility

# Monthly compatibility matrix: compilers, Ubuntu releases, build types, MPI
# implementations and the HeFFTe-free build, each with the full unit and
# 2-rank MPI tests. Pull requests and master run the narrower tiers in
# ci.yml. A red cell here is a finding: open an issue for it.
on:
  schedule:
    - cron: "0 2 1 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.cc }} / ${{ matrix.build_type }} / ${{ matrix.mpi }}${{ matrix.heffte == 'false' && ' / no HeFFTe' || '' }}
    if: github.repository == 'ahojukka5/OpenPFC'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, cc: gcc-11, cxx: g++-11, packages: "gcc-11 g++-11", build_type: Debug, mpi: openmpi, heffte: "true" }
          - { os: ubuntu-22.04, cc: gcc-11, cxx: g++-11, packages: "gcc-11 g++-11", build_type: Release, mpi: openmpi, heffte: "true" }
          - { os: ubuntu-22.04, cc: gcc-12, cxx: g++-12, packages: "gcc-12 g++-12", build_type: Release, mpi: openmpi, heffte: "true" }
          - { os: ubuntu-24.04, cc: gcc-12, cxx: g++-12, packages: "gcc-12 g++-12", build_type: Release, mpi: openmpi, heffte: "true" }
          - { os: ubuntu-24.04, cc: gcc-14, cxx: g++-14, packages: "gcc-14 g++-14", build_type: Debug, mpi: openmpi, heffte: "true" }
          - { os: ubuntu-24.04, cc: gcc-14, cxx: g++-14, packages: "gcc-14 g++-14", build_type: Release, mpi: openmpi, heffte: "true" }
          - { os: ubuntu-24.04, cc: clang-18, cxx: clang++-18, packages: "clang-18 libomp-18-dev", build_type: Release, mpi: openmpi, heffte: "true" }
          - { os: ubuntu-24.04, cc: gcc-13, cxx: g++-13, packages: "gcc-13 g++-13", build_type: Release, mpi: mpich, heffte: "true" }
          - { os: ubuntu-24.04, cc: gcc-13, cxx: g++-13, packages: "gcc-13 g++-13", build_type: Release, mpi: openmpi, heffte: "false" }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up the build
        id: setup
        uses: ./.github/actions/setup-build
        with:
          os: ${{ matrix.os }}
          compiler-packages: ${{ matrix.packages }}
          cc: ${{ matrix.cc }}
          cxx: ${{ matrix.cxx }}
          build-type: ${{ matrix.build_type }}
          mpi: ${{ matrix.mpi }}
          heffte: ${{ matrix.heffte }}

      - name: Configure OpenPFC
        run: |
          heffte_on=$([[ "${{ matrix.heffte }}" == "true" ]] && echo ON || echo OFF)
          cmake -S . -B build -GNinja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH="${{ steps.setup.outputs.heffte-prefix }}" \
            -DOpenPFC_ENABLE_HEFFTE=${heffte_on} \
            -DOpenPFC_BUILD_TESTS=ON \
            -DOpenPFC_BUILD_EXAMPLES=${heffte_on} \
            -DOpenPFC_BUILD_APPS=ON \
            -DOpenPFC_BUILD_DOCUMENTATION=OFF \
            -DOpenPFC_RUN_MPI_SUITES=ON \
            -DOpenPFC_MPI_TEST_MAX_WORLD_SIZE=2

      - name: Build OpenPFC
        run: cmake --build build -j2

      - name: Run tests
        working-directory: build
        run: |
          set -o pipefail
          ctest --output-on-failure -j2 --exclude-regex "benchmark" --timeout 300 | tee ctest.log
          total=$(grep -E "Total Test time" ctest.log | tail -1 || true)
          echo "${{ matrix.os }}/${{ matrix.cc }}/${{ matrix.build_type }}/${{ matrix.mpi }}/heffte=${{ matrix.heffte }} — ${total:-time unavailable}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.cc }}-${{ matrix.build_type }}-${{ matrix.mpi }}-heffte-${{ matrix.heffte }}
          path: build/Testing/Temporary/LastTest.log
